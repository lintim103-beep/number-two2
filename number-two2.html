<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>藍色背景網頁</title>
    <style>
        /* 1. 設定 html 與 body 高度為 100%，並移除邊距 */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            /* 2. 設定漸層背景 */
            background: linear-gradient(to bottom, #00c6ff, #0072ff);
            
            /* 3. 重要：固定背景，防止捲動時出現重複或留白 */
            background-attachment: fixed;
            
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>這是全螢幕背景</h1>
</body>
</html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>互動式籃球戰術板</title>
    <style>
        .court {
            width: 800px;
            height: 400px;
            background-color: #d2a679;
            border: 5px solid white;
            margin: 50px auto;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            user-select: none;
        }

        /* 球場繪製 (保持不變) */
        .mid-line { width: 2px; height: 100%; background-color: white; position: absolute; left: 50%; transform: translateX(-50%); }
        .center-circle { width: 100px; height: 100px; border: 2px solid white; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .key { width: 120px; height: 200px; border: 3px solid white; position: absolute; top: 100px; }
        .key.left { left: 0; } .key.right { right: 0; }
        .free-throw-circle { width: 120px; height: 120px; border: 3px solid white; border-radius: 50%; position: absolute; top: 140px; }
        .free-throw-circle.left { left: 60px; } .free-throw-circle.right { right: 60px; }
        .rim { width: 30px; height: 30px; border: 3px solid red; border-radius: 50%; position: absolute; top: 185px; }
        .rim.left { left: 10px; } .rim.right { left: 760px; }

        /* 通用拖曳物件樣式 */
        .draggable {
            position: absolute;
            cursor: grab;
            touch-action: none;
            z-index: 10;
        }

        /* 球員樣式 */
        .player {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid white;
        }
        .red { background-color: #ff4d4d; }
        .blue { background-color: #4d94ff; }

        /* 籃球樣式 */
        .ball {
            width: 15px;
            height: 15px;
            background-color: orange;
            border-radius: 50%;
            border: 1px solid #d35400; /* 加點邊框讓球看起來更立體 */
            z-index: 20; /* 讓球在球員上方 */
        }
    </style>
</head>
<body>

    <div class="court">
        <!-- 畫線 -->
        <div class="mid-line"></div>
        <div class="center-circle"></div>
        <div class="key left"></div><div class="key right"></div>
        <div class="free-throw-circle left"></div><div class="free-throw-circle right"></div>
        <div class="rim left"></div><div class="rim right"></div>

        <!-- 球員 (紅隊) -->
        <div class="draggable player red" style="top: 190px; left: 180px;"></div>
        <div class="draggable player red" style="top: 110px; left: 250px;"></div>
        <div class="draggable player red" style="top: 350px; left: 50px;"></div>
        <div class="draggable player red" style="top: 230px; left: 100px;"></div>
        <div class="draggable player red" style="top: 280px; left: 30px;"></div>

        <!-- 球員 (藍隊) -->
        <div class="draggable player blue" style="top: 190px; left: 230px;"></div>
        <div class="draggable player blue" style="top: 125px; left: 280px;"></div>
        <div class="draggable player blue" style="top: 330px; left: 750px;"></div>
        <div class="draggable player blue" style="top: 230px; left: 680px;"></div>
        <div class="draggable player blue" style="top: 200px; left: 750px;"></div>

        <!-- 籃球 -->
        <div class="draggable ball" style="top: 200px; left: 200px;"></div>
    </div>

    <script>
        let draggedElement = null;
        let offsetX, offsetY;

        // 監聽所有具備 .draggable 類別的元素 (球員與籃球)
        document.querySelectorAll('.draggable').forEach(item => {
            item.addEventListener('pointerdown', function(e) {
                draggedElement = this;
                offsetX = e.clientX - draggedElement.offsetLeft;
                offsetY = e.clientY - draggedElement.offsetTop;
                draggedElement.style.zIndex = 100; // 拖動時拉到最上層
            });
        });

        document.addEventListener('pointermove', function(e) {
            if (draggedElement) {
                draggedElement.style.left = (e.clientX - offsetX) + 'px';
                draggedElement.style.top = (e.clientY - offsetY) + 'px';
            }
        });

        document.addEventListener('pointerup', function() {
            if (draggedElement) {
                draggedElement.style.zIndex = (draggedElement.classList.contains('ball')) ? 20 : 10;
                draggedElement = null;
            }
        });
    </script>
</body>
</html>
