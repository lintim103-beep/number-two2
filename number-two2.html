<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>藍色背景網頁
    </title>
    <style>
        body {
            /* 這裡是設定背景顏色的地方 */
            background-color: blue;
            
            /* 讓文字顏色變成白色，這樣在藍色背景上才看得清楚 */
            color: white;
            
            /* 設定字體以增加美觀 */
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
    </style>
</head>
<body>
    <h1>歡迎來到我的藍色網頁！</h1>
    <p>這是一個示範背景顏色的頁面。</p>
</body>
</html>
