<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>互動籃球戰術板</title>
    
    <!-- Open Graph 設定 (Discord 預覽) -->
    <meta property="og:title" content="互動式籃球戰術板">
    <meta property="og:description" content="這是一個可以在手機與電腦上使用的互動式籃球戰術板。">
    <meta property="og:type" content="website">

    <style>
        /* 基礎全域設定 */
        body { 
            margin: 0; display: flex; justify-content: center; align-items: center; 
            height: 100vh; background: #2c3e50; font-family: sans-serif; 
            overflow: hidden; 
            /* 關鍵：徹底鎖死瀏覽器預設捲動行為，防止拖曳變形 */
            overscroll-behavior: none; 
            touch-action: none;
        }

        #musicBtn {
            position: absolute; top: 20px; right: 20px; padding: 10px 20px;
            background-color: #27ae60; color: white; border: none; border-radius: 5px;
            cursor: pointer; z-index: 100; touch-action: manipulation;
        }

        .court {
            width: 95vw; max-width: 900px; aspect-ratio: 2 / 1;
            background-color: #d2a679; border: 5px solid white; position: relative;
            border-radius: 10px; user-select: none; overflow: hidden; 
            /* GPU 加速 */
            transform: translateZ(0);
        }

        /* 繪圖樣式 */
        .line { position: absolute; border: 2px solid white; box-sizing: border-box; }
        .mid-line { width: 2px; height: 100%; left: 50%; border: none; background: white; transform: translateX(-50%); }
        .center-circle { width: 20%; aspect-ratio: 1/1; border-radius: 50%; left: 50%; top: 50%; transform: translate(-50%, -50%); border: 2px solid white; }
        .key { width: 15%; height: 50%; border: 2px solid white; top: 25%; }
        .key.left { left: 0; } .key.right { right: 0; }
        .ft-circle { width: 15%; aspect-ratio: 1/1; border-radius: 50%; top: 50%; transform: translateY(-50%); border: 2px solid white; }
        .ft-circle.left { left: 10%; } .ft-circle.right { right: 10%; }
        .three-point { width: 30%; height: 80%; border: 2px solid white; top: 10%; position: absolute; }
        .three-point.left { left: 0; border-radius: 0 100% 100% 0; border-left: none; }
        .three-point.right { right: 0; border-radius: 100% 0 0 100%; border-right: none; }
        .rim { width: 6%; aspect-ratio: 1/1; border: 3px solid #c0392b; border-radius: 50%; top: 42%; position: absolute; z-index: 5; }
        .rim.left { left: 1%; } .rim.right { right: 1%; }
        
        /* 拖曳物件優化 */
        .draggable {
            position: absolute; width: 6%; aspect-ratio: 1 / 1; cursor: grab;
            z-index: 10; border-radius: 50%; border: 2px solid white;
            /* 關鍵：防止閃爍與變形 */
            will-change: transform; 
            transform: translateZ(0);
            transition: transform 0.05s linear;
        }
        .red { background-color: #e74c3c; }
        .blue { background-color: #3498db; }
        .ball { background-color: #f39c12; border: 2px solid #d35400; z-index: 20; }
    </style>
</head>
<body>
    <button id="musicBtn">音樂 🎵</button>
    <div class="court">
        <div class="line mid-line"></div>
        <div class="line center-circle"></div>
        <div class="line key left"></div><div class="line key right"></div>
        <div class="line ft-circle left"></div><div class="line ft-circle right"></div>
        <div class="line three-point left"></div><div class="line three-point right"></div>
        <div class="rim left"></div><div class="rim right"></div>

        <div class="draggable red" style="top: 20%; left: 15%;"></div>
        <div class="draggable red" style="top: 40%; left: 25%;"></div>
        <div class="draggable red" style="top: 60%; left: 15%;"></div>
        <div class="draggable red" style="top: 30%; left: 5%;"></div>
        <div class="draggable red" style="top: 50%; left: 5%;"></div>
        <div class="draggable blue" style="top: 20%; left: 80%;"></div>
        <div class="draggable blue" style="top: 40%; left: 70%;"></div>
        <div class="draggable blue" style="top: 60%; left: 80%;"></div>
        <div class="draggable blue" style="top: 30%; left: 90%;"></div>
        <div class="draggable blue" style="top: 50%; left: 90%;"></div>
        <div class="draggable ball" style="top: 50%; left: 50%;"></div>
    </div>

    <script>
        let draggedElement = null;
        let offsetX, offsetY;

        // 綁定事件
        document.querySelectorAll('.draggable').forEach(item => {
            item.addEventListener('pointerdown', function(e) {
                draggedElement = this;
                const rect = draggedElement.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
                draggedElement.style.zIndex = 100;
            });
        });

        document.addEventListener('pointermove', function(e) {
            if (draggedElement) {
                const courtRect = document.querySelector('.court').getBoundingClientRect();
                // 計算比例
                let x = ((e.clientX - courtRect.left - offsetX) / courtRect.width) * 100;
                let y = ((e.clientY - courtRect.top - offsetY) / courtRect.height) * 100;
                
                // 限制範圍 (0-96)
                draggedElement.style.left = Math.max(0, Math.min(x, 96)) + '%';
                draggedElement.style.top = Math.max(0, Math.min(y, 96)) + '%';
            }
        });

        document.addEventListener('pointerup', function() {
            if (draggedElement) {
                draggedElement.style.zIndex = draggedElement.classList.contains('ball') ? 20 : 10;
                draggedElement = null;
            }
        });
    </script>
</body>
</html>
